name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          set -e
          # Single source of truth: the [package].cyrius pin in cyrius.cyml.
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve deps
        # Vendors the version-pinned stdlib into ./lib from [deps].stdlib.
        # lib/ is gitignored — it's a build artifact, not source.
        run: cyrius deps

      - name: Format check
        run: |
          for f in src/*.cyr; do
            cyrius fmt "$f" --check || { echo "::error::fmt drift in $f — run 'cyrius fmt'"; exit 1; }
          done

      - name: Lint
        # src is warning-clean as of 2.2.1; any new warning fails the gate.
        run: |
          fail=0
          for f in src/*.cyr; do
            out=$(cyrius lint "$f" 2>&1 || true)
            if echo "$out" | grep -qE '^\s*warn '; then
              echo "$out"; echo "::error::lint warnings in $f"; fail=1
            fi
          done
          [ $fail -eq 0 ] || exit 1

      - name: Vet
        run: cyrius vet src/main.cyr

      - name: Build smoke (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/abaco
          echo "abaco: $(wc -c < build/abaco) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/abaco | grep -q "7f45 4c46"

      - name: Verify dist bundle is current
        # dist/abaco.cyr is the committed consumer bundle (hisab, dhvani,
        # Abacus import it via `[deps.abaco] modules = ["dist/abaco.cyr"]`).
        # Regenerate and fail if the checked-in copy drifted from src/.
        run: |
          cyrius distlib
          git diff --exit-code dist/abaco.cyr || {
            echo "::error::dist/abaco.cyr is stale — run 'cyrius distlib' and commit"; exit 1; }

      - name: Test
        # Full suite, all tests gated (SIMD un-quarantined in 2.2.1 — the
        # f64v_* intrinsics that SIGSEGV'd under 5.7.23 are fixed in 6.0.1).
        run: |
          fail=0
          total=0
          for t in tests/test_*.tcyr; do
            [ -f "$t" ] || continue
            name=$(basename "$t" .tcyr)
            echo "::group::$name"
            out=$(cyrius test "$t" 2>&1); rc=$?
            echo "$out"
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then echo "FAIL: $name"; fail=1; fi
            n=$(echo "$out" | grep -oE '[0-9]+ passed' | head -1 | awk '{print $1}')
            total=$((total + ${n:-0}))
          done
          echo "asserts passed: $total"
          [ $fail -eq 0 ] || { echo "test failures"; exit 1; }

      - name: Fuzz (smoke)
        run: |
          for f in fuzz/fuzz_*.cyr; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .cyr)
            echo "::group::$name"
            CYRIUS_DCE=1 cyrius build "$f" "build/$name"
            timeout 10 "build/$name" 1000 || { echo "FUZZ CRASH: $name"; exit 1; }
            echo "  $name: ok"
            echo "::endgroup::"
          done

      - name: Bench (non-fatal)
        run: |
          for b in benches/*.bcyr; do
            [ -f "$b" ] || continue
            echo "::group::$b"
            CYRIUS_DCE=1 cyrius bench "$b" || true
            echo "::endgroup::"
          done | tee bench-results.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: abaco-${{ github.sha }}
          path: |
            build/abaco
            dist/abaco.cyr
            bench-results.txt
          if-no-files-found: warn

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for dangerous patterns
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rn "$pat" src/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then
              echo "FAIL: $label"
              echo "$hits"
              FAIL=1
            fi
          }
          scan "raw execve"   'syscall\(\s*59'
          scan "raw fork"     'syscall\(\s*57'
          scan "sys_system"   '\bsys_system\s*\('
          scan "writes to /etc"  '"/etc/'
          scan "writes to /bin"  '"/bin/'
          scan "writes to /sbin" '"/sbin/'
          awk -F: '
            /var [A-Za-z_][A-Za-z0-9_]*\[[0-9]+\]/ {
              match($0, /\[[0-9]+\]/); s=substr($0,RSTART+1,RLENGTH-2); n=s+0;
              if (n >= 65536) print FILENAME":"NR": large stack buffer ("n" bytes): "$0
            }' src/*.cyr | tee /tmp/bigbuf.txt
          [ -s /tmp/bigbuf.txt ] && FAIL=1
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md ROADMAP.md VERSION CONTRIBUTING.md \
                   SECURITY.md CODE_OF_CONDUCT.md LICENSE cyrius.cyml; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING: $f"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $FILE_VERSION"
          # cyrius.cyml derives its version from VERSION via ${file:VERSION},
          # so the file is the single source of truth. Confirm the pin
          # template is intact and the version appears in the changelog.
          grep -qF 'version = "${file:VERSION}"' cyrius.cyml \
            || { echo "FAIL: cyrius.cyml version is not \${file:VERSION}"; exit 1; }
          grep -q "$FILE_VERSION" CHANGELOG.md \
            || { echo "FAIL: version $FILE_VERSION not in CHANGELOG.md"; exit 1; }
          echo "Version consistent: $FILE_VERSION"
