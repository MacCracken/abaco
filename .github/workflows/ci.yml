name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Cyrius toolchain
        run: |
          set -e
          # Single source of truth: the [package].cyrius pin in cyrius.cyml.
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          # The installer from the pinned tag, not main: it carries the release
          # signing key for the version it installs. Saved to a file first so a
          # failed download fails the step (a `curl | sh` pipe reports sh's status).
          curl -sSfo install.sh "https://raw.githubusercontent.com/MacCracken/cyrius/${CYRIUS_VERSION}/scripts/install.sh"
          CYRIUS_VERSION="$CYRIUS_VERSION" sh install.sh
          rm -f install.sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve deps
        # Vendors the version-pinned stdlib into ./lib from [deps].stdlib.
        # lib/ is gitignored — it's a build artifact, not source. cyrius.lock is
        # committed: a missing lock, a re-lock (new leaf, moved pin) or a hash
        # mismatch fails here instead of being written silently.
        run: |
          test -f cyrius.lock || { echo "::error::cyrius.lock is missing — run 'cyrius deps' and commit it"; exit 1; }
          cyrius deps
          cyrius deps --verify
          git diff --exit-code cyrius.lock || {
            echo "::error::cyrius.lock changed on resolve — run 'cyrius deps' and commit it"; exit 1; }

      - name: Format check
        # Every source kind, not just src/ — through 2.4.3 this loop covered
        # src/*.cyr alone, so three test/fuzz files sat fmt-dirty for releases
        # while the gate reported clean. Looped so each drifted file gets its
        # own ::error:: (through Cyrius 6.6.4 the loop was also the only way to
        # check more than one file — extra paths were silently dropped).
        run: |
          for f in src/*.cyr tests/*.tcyr benches/*.bcyr fuzz/*.fcyr; do
            [ -f "$f" ] || continue
            cyrius fmt "$f" --check || { echo "::error::fmt drift in $f — run 'cyrius fmt \"$f\"'"; exit 1; }
          done

      - name: Lint
        # src is warning-clean as of 2.2.1; any new warning fails the gate.
        # Cyrius 6.5.x added an untracked-deferral advisory that prints as
        # "deferral line N: ..." rather than "warn ...", so it needs its own
        # match or it slips through the gate silently (see CHANGELOG 2.3.4).
        # The exit status is a gate too (2.4.9): through 2.4.8 it was discarded
        # with `|| true`, so a lint run that could not read the file passed.
        run: |
          fail=0
          for f in src/*.cyr; do
            rc=0
            out=$(cyrius lint --exit-with-count "$f" 2>&1) || rc=$?
            if [ $rc -ne 0 ]; then
              echo "$out"; echo "::error::lint failed on $f (exit $rc)"; fail=1
            fi
            if echo "$out" | grep -qE '^\s*warn '; then
              echo "$out"; echo "::error::lint warnings in $f"; fail=1
            fi
            if echo "$out" | grep -qE '^\s*deferral line '; then
              echo "$out"; echo "::error::untracked deferrals in $f — cite a CHANGELOG/roadmap/docs/issue reference on the marker line"; fail=1
            fi
          done
          [ $fail -eq 0 ] || exit 1

      - name: Vet
        run: cyrius vet src/main.cyr

      - name: Build smoke (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/abaco
          echo "abaco: $(wc -c < build/abaco) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/abaco | grep -q "7f45 4c46"

      - name: Verify dist bundle is current
        # dist/abaco.cyr is the committed consumer bundle (dhvani, Abacus
        # import it via `[deps.abaco] modules = ["dist/abaco.cyr"]`).
        # The manifest declares [lib] (not [lib.abaco]) since 2.4.6, so `cyrius distlib`
        # writes dist/abaco.cyr directly — no profile argument, no rename. While it was
        # [lib.abaco], a bare `cyrius distlib` errored "no [build] modules or [lib]
        # modules found": the bundle every consumer imports could not be regenerated
        # by the obvious command, only by `distlib abaco && mv`.
        # Fails if the checked-in copy drifted.
        run: |
          cyrius distlib
          git diff --exit-code dist/abaco.cyr || {
            echo "::error::dist/abaco.cyr is stale — run 'cyrius distlib' and commit"; exit 1; }

      - name: Test
        # Full suite, all tests gated (SIMD un-quarantined in 2.2.1 — the
        # f64v_* intrinsics that SIGSEGV'd under 5.7.23 are fixed in 6.0.1).
        run: |
          fail=0
          total=0
          for t in tests/test_*.tcyr; do
            [ -f "$t" ] || continue
            name=$(basename "$t" .tcyr)
            echo "::group::$name"
            # Same `bash -e` hazard as the security scan below, but on the
            # FAILURE path: `cyrius test` exits non-zero for a red suite, which
            # under `-e` would kill this step at the assignment — before rc is
            # captured, before the per-suite FAIL line prints, and before the
            # failure-count gate below runs. The job would still go red, but
            # silently and without saying which suite or how many.
            rc=0
            out=$(cyrius test "$t" 2>&1) || rc=$?
            echo "$out"
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then echo "FAIL: $name (exit $rc)"; fail=1; fi
            n=$(echo "$out" | grep -oE '[0-9]+ passed' | head -1 | awk '{print $1}')
            total=$((total + ${n:-0}))
            # Second, INDEPENDENT gate on the reported failure count. Until
            # 2.4.4 every .tcyr called assert_summary() and then `return 0;`,
            # discarding the failure count it returns — so a red suite exited 0
            # and the rc check above passed it. That is fixed at the source
            # (each suite now returns 1 when assert_summary() is non-zero;
            # collapsed rather than raw because an exit code is 8 bits and
            # exactly 256 failures would wrap back to 0). A single `return 0;`
            # creeping back would silently disarm that again, so also read the
            # summary line. Absent/unparseable counts as a failure, not a pass.
            f=$(echo "$out" | grep -oE '[0-9]+ failed' | head -1 | awk '{print $1}')
            if [ -z "$f" ]; then echo "FAIL: $name — no 'N failed' summary line"; fail=1
            elif [ "$f" -ne 0 ]; then echo "FAIL: $name ($f assertions failed)"; fail=1; fi
          done
          echo "asserts passed: $total"
          [ $fail -eq 0 ] || { echo "test failures"; exit 1; }

      - name: Fuzz (smoke)
        run: |
          for f in fuzz/*.fcyr; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .fcyr)
            echo "::group::$name"
            CYRIUS_DCE=1 cyrius build "$f" "build/$name"
            timeout 10 "build/$name" 1000 || { echo "FUZZ CRASH: $name"; exit 1; }
            echo "  $name: ok"
            echo "::endgroup::"
          done

      - name: Bench build
        # Fatal: a bench that no longer compiles is a broken gate, not noise.
        # Through 2.4.8 the only bench step ran `cyrius bench ... || true`, so
        # the 2.4.7 _bench_round breakage passed CI.
        run: |
          for b in benches/*.bcyr; do
            [ -f "$b" ] || continue
            CYRIUS_DCE=1 cyrius build "$b" "build/$(basename "$b" .bcyr)"
          done

      - name: Bench (timing non-fatal)
        run: |
          for b in benches/*.bcyr; do
            [ -f "$b" ] || continue
            echo "::group::$b"
            CYRIUS_DCE=1 cyrius bench "$b" || true
            echo "::endgroup::"
          done | tee bench-results.txt
          # Row names key the CSV trail and bench-latest.md, so a duplicate
          # shadows a row (2.4.8: `sqrt` in two files). That is a code defect.
          dupes=$(grep -E 'avg.*min=.*max=' bench-results.txt | sed -E 's/^[[:space:]]*//; s/:.*//' | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "::error::duplicate bench names: $dupes"; exit 1; fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: abaco-${{ github.sha }}
          path: |
            build/abaco
            dist/abaco.cyr
            bench-results.txt
          if-no-files-found: warn

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan for dangerous patterns
        run: |
          FAIL=0
          # -E, not the default BRE. Through 2.4.4 this ran plain `grep -rn`,
          # where `\(` opens a GROUP rather than matching a literal paren — so
          # `syscall\(\s*59`, `syscall\(\s*57` and `\bsys_system\s*\(` all died
          # with "Unmatched ( or \(" and rc=2. `2>/dev/null` swallowed the
          # error, `hits` came back empty, and the step reported clean: THREE OF
          # SIX patterns had never matched anything. Verified against GNU grep
          # 3.12 — the same pattern strings work unchanged under -E. rc=2 is now
          # a failure rather than a pass, so a future malformed pattern cannot
          # go quiet the same way.
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits rc
            # `|| rc=$?`, NOT `; rc=$?`. GitHub runs every step under
            # `bash -e`, and grep exits 1 when it finds NOTHING — the clean
            # case. A bare `hits=$(grep ...)` therefore takes grep's failing
            # status as the assignment's status and `-e` kills the step before
            # `rc=$?` ever runs, with no output at all. Putting the assignment
            # in a `||` list exempts it from `-e` (bash only exits on the LAST
            # command of such a list), so rc=1 "no match" is observed rather
            # than fatal, while a genuine rc=2 still reports below.
            rc=0
            hits=$(grep -rnE "$pat" src/ 2>/dev/null) || rc=$?
            if [ $rc -gt 1 ]; then
              echo "::error::security scan pattern is invalid (grep rc=$rc): $label -- $pat"
              FAIL=1
              return
            fi
            hits=$(printf '%s' "$hits" | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then
              echo "FAIL: $label"
              echo "$hits"
              FAIL=1
            fi
          }
          # Process creation and signals: the stdlib wrappers by name and the
          # raw x86_64 numbers (56 clone, 57 fork, 58 vfork, 59 execve, 62 kill,
          # 322 execveat) or their SYS_ names. Through 2.4.8 the third pattern
          # was `sys_system`, which names no function, and sys_execve /
          # sys_fork / sys_kill went unscanned.
          scan "process wrappers" '\bsys_(execve|execveat|fork|vfork|clone|kill|spawn)\s*\('
          scan "raw process syscalls" 'syscall\(\s*(SYS_(EXECVE|EXECVEAT|FORK|VFORK|CLONE|KILL)\b|5[6-9]\b|62\b|322\b)'
          scan "writes to /etc"  '"/etc/'
          scan "writes to /bin"  '"/bin/'
          scan "writes to /sbin" '"/sbin/'
          # Sizes may be written in hex or with '_' separators (0x100000,
          # 1_048_576) — through 2.4.8 only plain decimal was matched, so a
          # 1 MiB buffer written either way passed. Hex is converted by hand:
          # ubuntu's default awk is mawk, which has no strtonum.
          awk '
            function num(s,   i, v) {
              gsub(/_/, "", s)
              if (s !~ /^0[xX]/) return s + 0
              v = 0
              for (i = 3; i <= length(s); i++)
                v = v * 16 + index("0123456789abcdef", tolower(substr(s, i, 1))) - 1
              return v
            }
            /var [A-Za-z_][A-Za-z0-9_]*\[(0[xX][0-9A-Fa-f_]+|[0-9_]+)\]/ {
              match($0, /\[(0[xX][0-9A-Fa-f_]+|[0-9_]+)\]/)
              n = num(substr($0, RSTART + 1, RLENGTH - 2))
              if (n >= 65536) print FILENAME":"FNR": large stack buffer ("n" bytes): "$0
            }' src/*.cyr | tee /tmp/bigbuf.txt
          [ -s /tmp/bigbuf.txt ] && FAIL=1
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md ROADMAP.md VERSION CONTRIBUTING.md \
                   SECURITY.md CODE_OF_CONDUCT.md LICENSE cyrius.cyml; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING: $f"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $FILE_VERSION"
          # cyrius.cyml derives its version from VERSION via ${file:VERSION},
          # so the file is the single source of truth. Confirm the pin
          # template is intact and the version appears in the changelog.
          grep -qF 'version = "${file:VERSION}"' cyrius.cyml \
            || { echo "FAIL: cyrius.cyml version is not \${file:VERSION}"; exit 1; }
          # A section heading for exactly this version, not the digits anywhere
          # (2.4.1 would have matched "2.4.10" or a date).
          grep -qE "^## \[${FILE_VERSION//./\\.}\]" CHANGELOG.md \
            || { echo "FAIL: no '## [$FILE_VERSION]' section in CHANGELOG.md"; exit 1; }
          echo "Version consistent: $FILE_VERSION"
