name: Release

on:
  push:
    # Plain semver tags only (no `v` prefix) — `git tag $(cat VERSION)`.
    # Version-verify enforces the match against the VERSION file.
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

# Read-only by default; only the job that publishes gets a write token, so the
# CI gate (which runs the installer and repo binaries) never holds one.
permissions:
  contents: read

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          # ${file:VERSION} template means cyrius.cyml derives its version
          # from the VERSION file — VERSION is the single source of truth.
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then
            CYML_VERSION="$FILE_VERSION"
          else
            CYML_VERSION="$CYML_RAW"
          fi
          TAG="${GITHUB_REF_NAME}"
          [ "$FILE_VERSION" = "$TAG" ] || { echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          [ "$CYML_VERSION" = "$TAG" ] || { echo "cyrius.cyml ($CYML_RAW) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG"

      - name: Install Cyrius toolchain
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          # The installer from the pinned tag, not main: it carries the release
          # signing key for the version it installs. Saved to a file first so a
          # failed download fails the step (a `curl | sh` pipe reports sh's status).
          curl -sSfo install.sh "https://raw.githubusercontent.com/MacCracken/cyrius/${CYRIUS_VERSION}/scripts/install.sh"
          CYRIUS_VERSION="$CYRIUS_VERSION" sh install.sh
          rm -f install.sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve deps
        # Vendors the version-pinned stdlib into ./lib from [deps].stdlib.
        # lib/ is gitignored — it's a build artifact, not source. cyrius.lock is
        # committed: a missing lock, a re-lock (new leaf, moved pin) or a hash
        # mismatch fails here instead of being written silently.
        run: |
          test -f cyrius.lock || { echo "::error::cyrius.lock is missing — run 'cyrius deps' and commit it"; exit 1; }
          cyrius deps
          cyrius deps --verify
          git diff --exit-code cyrius.lock || {
            echo "::error::cyrius.lock changed on resolve — run 'cyrius deps' and commit it"; exit 1; }

      - name: Build smoke (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/abaco
          echo "abaco: $(wc -c < build/abaco) bytes"

      - name: Regenerate bundle
        # [lib] (not [lib.abaco]) since 2.4.6, so distlib writes the consumer path
        # dist/abaco.cyr directly — no profile argument, no rename.
        run: |
          cyrius distlib

      - name: Test
        run: |
          for t in tests/test_*.tcyr; do
            [ -f "$t" ] || continue
            cyrius test "$t"
          done

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="abaco-${TAG}/" -o "abaco-${TAG}-src.tar.gz" HEAD
          cp dist/abaco.cyr "abaco-${TAG}.cyr"
          [ -f build/abaco ] && cp build/abaco "abaco-${TAG}-x86_64-linux"
          sha256sum abaco-*.tar.gz abaco-*.cyr abaco-*-linux 2>/dev/null > SHA256SUMS
          cat SHA256SUMS

      - name: Extract changelog
        run: |
          awk "/^## \\[${GITHUB_REF_NAME}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" \
            CHANGELOG.md > /tmp/body.md
          # `[ -s ]` alone cannot see an UNFILLED stub: scripts/version-bump.sh
          # emits bare "### Changed/Added/Fixed" headings, which are ~36
          # non-empty bytes, so the file is non-empty and the fallback never
          # fired — a release could ship with three empty headings as its notes.
          # Strip blank lines and heading-only lines before deciding.
          if [ -z "$(sed -e 's/^[[:space:]]*//' -e '/^#\{1,\}[[:space:]]*[A-Za-z]*[[:space:]]*$/d' \
                       -e '/^$/d' /tmp/body.md)" ]; then
            echo "::error::CHANGELOG [${GITHUB_REF_NAME}] is missing or an unfilled stub — fill it before tagging"
            exit 1
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2.6.2
        with:
          name: "abaco ${{ github.ref_name }}"
          body_path: /tmp/body.md
          prerelease: ${{ startsWith(github.ref_name, '0.') }}
          files: |
            abaco-*-src.tar.gz
            abaco-*.cyr
            abaco-*-linux
            SHA256SUMS
