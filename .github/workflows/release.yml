name: Release

on:
  push:
    # Plain semver tags only (no `v` prefix) — `git tag $(cat VERSION)`.
    # Version-verify enforces the match against the VERSION file.
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          # ${file:VERSION} template means cyrius.cyml derives its version
          # from the VERSION file — VERSION is the single source of truth.
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then
            CYML_VERSION="$FILE_VERSION"
          else
            CYML_VERSION="$CYML_RAW"
          fi
          TAG="${GITHUB_REF_NAME}"
          [ "$FILE_VERSION" = "$TAG" ] || { echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          [ "$CYML_VERSION" = "$TAG" ] || { echo "cyrius.cyml ($CYML_RAW) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG"

      - name: Install Cyrius toolchain
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve deps
        run: cyrius deps

      - name: Build smoke (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/abaco
          echo "abaco: $(wc -c < build/abaco) bytes"

      - name: Regenerate bundle
        # 6.2.x distlib reads the [lib.abaco] profile and writes
        # dist/abaco-abaco.cyr; rename to the consumer path dist/abaco.cyr.
        run: |
          cyrius distlib abaco
          mv dist/abaco-abaco.cyr dist/abaco.cyr

      - name: Test
        run: |
          for t in tests/test_*.tcyr; do
            [ -f "$t" ] || continue
            cyrius test "$t"
          done

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="abaco-${TAG}/" -o "abaco-${TAG}-src.tar.gz" HEAD
          cp dist/abaco.cyr "abaco-${TAG}.cyr"
          [ -f build/abaco ] && cp build/abaco "abaco-${TAG}-x86_64-linux"
          sha256sum abaco-*.tar.gz abaco-*.cyr abaco-*-linux 2>/dev/null > SHA256SUMS
          cat SHA256SUMS

      - name: Extract changelog
        run: |
          awk "/^## \\[${GITHUB_REF_NAME}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" \
            CHANGELOG.md > /tmp/body.md
          [ -s /tmp/body.md ] || echo "No changelog entry for ${GITHUB_REF_NAME}." > /tmp/body.md

      - uses: softprops/action-gh-release@v2
        with:
          name: "abaco ${{ github.ref_name }}"
          body_path: /tmp/body.md
          prerelease: ${{ startsWith(github.ref_name, '0.') }}
          files: |
            abaco-*-src.tar.gz
            abaco-*.cyr
            abaco-*-linux
            SHA256SUMS
